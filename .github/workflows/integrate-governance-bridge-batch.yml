name: Integrate accepted Governance Bridge batch

on:
  push:
    branches:
      - integration/governance-bridge-batch-20261002
    paths:
      - .github/workflows/integrate-governance-bridge-batch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/governance-bridge-batch-20261002
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Merge exact accepted heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for sha in \
            d74455b581f13a08e6ec4435eecd7b116a4236e5 \
            aee97e7261a7445b33229c1da023b92ef65958b3 \
            63ef08e0346f0631ed6d21713df98b9a8c41cd46
          do
            git cat-file -e "$sha^{commit}"
            git merge --no-ff --no-edit "$sha"
          done
          ! grep -R "authoritativeTerminalSnapshot\|forced_snapshot\.terminalized\|authoritative_forced_snapshot" src/bridge/coordinator/requestRecoveryCoordinator.js test/requestLifecycleDeadlines.test.js
          grep -q "authoritativeInactiveSnapshot" src/bridge/coordinator/requestRecoveryCoordinator.js
          git diff --check HEAD~0
      - name: Validate combined source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run check:quality
          npm test
      - name: Remove one-time workflow and publish integration branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integrate-governance-bridge-batch.yml
          git commit -m "chore: remove one-time Bridge integration workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
